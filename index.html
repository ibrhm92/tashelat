<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسهيلات - إدارة الأعمال</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>ابراهيم القصاص</h1>
            <h2>تسهيلات</h2>
            <p>تطبيق لإدارة وتسهيل أعمالك</p>
        </header>

        <main class="main-content">
            <div class="buttons-grid">
                <a href="bank-balance.html" class="btn btn-primary">
                    <span class="btn-icon">🏦</span>
                    <span class="btn-text">رصيد البنك</span>
                </a>
                
                <a href="bank-transactions.html" class="btn btn-primary">
                    <span class="btn-icon">💰</span>
                    <span class="btn-text">وارد ومنصرف البنوك</span>
                </a>
                
                <a href="cheques-management.html" class="btn btn-primary">
                    <span class="btn-icon">📄</span>
                    <span class="btn-text">تسجيلات الشيكات</span>
                </a>
                
                <a href="transfers-tracking.html" class="btn btn-primary">
                    <span class="btn-icon">⚙️</span>
                    <span class="btn-text">متابعة التحويلات</span>
                </a>
                
                <button id="exportAllData" class="btn btn-success">
                    <span class="btn-icon">📊</span>
                    <span class="btn-text">تصدير جميع البيانات</span>
                </button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
