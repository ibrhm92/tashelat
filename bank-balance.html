<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رصيد البنك - تسهيلات</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="nav-header">
                <a href="index.html" class="back-btn">←</a>
                <h1>رصيد البنك</h1>
            </div>
        </header>

        <main class="main-content">
            <div class="form-container">
                <div class="saved-banks">
                    <h3>البنوك المثبتة</h3>
                    <div id="savedBanksList" class="banks-list">
                        <!-- سيتم إضافة البنوك المحفوظة هنا -->
                    </div>
                    <button id="addBankBtn" class="btn btn-outline">+ إضافة بنك جديد</button>
                </div>

                <form id="balanceForm" class="balance-form">
                    <div id="banksContainer">
                        <div class="bank-item">
                            <div class="form-group">
                                <label for="bank1">البنك</label>
                                <select id="bank1" name="bank1" class="bank-select" required>
                                    <option value="">اختر البنك</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="balance1">الرصيد</label>
                                <div class="balance-input-group">
                                    <input type="text" id="balance1" name="balance1" placeholder="0.00" inputmode="decimal" required>
                                    <select id="currency1" name="currency1" class="currency-select">
                                        <option value="جنيه" selected>جنيه</option>
                                        <option value="ريال">ريال</option>
                                        <option value="دولار">دولار</option>
                                        <option value="يورو">يورو</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="addMoreBtn" class="btn btn-secondary">+ إضافة بنك آخر</button>
                        <button type="submit" class="btn btn-primary">إرسال للواتساب</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div id="addBankModal" class="modal">
        <div class="modal-content">
            <h3>إضافة بنك جديد</h3>
            <form id="addBankForm">
                <div class="form-group">
                    <label for="newBankName">اسم البنك</label>
                    <input type="text" id="newBankName" required>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancelAddBank" class="btn btn-secondary">إلغاء</button>
                    <button type="submit" class="btn btn-primary">إضافة</button>
                </div>
            </form>
        </div>
    </div>

    <script src="bank-balance.js"></script>
</body>
</html>
